<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 150" width="860">
  <defs>
    <linearGradient id="kpibg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060e"/>
      <stop offset="100%" stop-color="#080d1c"/>
    </linearGradient>
    <!-- Per-tile dark tint gradients -->
    <linearGradient id="t1bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001d29"/>
      <stop offset="100%" stop-color="#00080f"/>
    </linearGradient>
    <linearGradient id="t2bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#280016"/>
      <stop offset="100%" stop-color="#10000a"/>
    </linearGradient>
    <linearGradient id="t3bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0830"/>
      <stop offset="100%" stop-color="#0a0014"/>
    </linearGradient>
    <linearGradient id="t4bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#251b00"/>
      <stop offset="100%" stop-color="#0f0c00"/>
    </linearGradient>
    <filter id="kpiGlow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="kpiSmallGlow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="kpiGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0a1830" stroke-width="0.4"/>
    </pattern>
  </defs>

  <!-- Outer background -->
  <rect width="860" height="150" rx="13" fill="url(#kpibg)"/>
  <rect width="860" height="150" rx="13" fill="url(#kpiGrid)" opacity="0.5"/>
  <rect width="860" height="150" rx="13" fill="none" stroke="#1a2a4a" stroke-width="1.5"/>
  <rect width="860" height="150" rx="13" fill="none" stroke="#a855f7" stroke-width="1">
    <animate attributeName="opacity" values="0.1;0.35;0.1" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- ===== TILE 1: EXPERIENCE (CYAN) ===== -->
  <rect x="11" y="11" width="194" height="128" rx="10" fill="url(#t1bg)" stroke="#00f0ff" stroke-width="1.2"/>
  <!-- Top accent bar -->
  <rect x="11" y="11" width="194" height="4" rx="3" fill="#00f0ff" opacity="0.7"/>
  <!-- Animated border -->
  <rect x="11" y="11" width="194" height="128" rx="10" fill="none" stroke="#00f0ff" stroke-width="1">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>
  <!-- Icon -->
  <text x="108" y="53" text-anchor="middle" font-family="Arial" font-size="22">⚡</text>
  <!-- Big metric number -->
  <text x="108" y="90" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="32" font-weight="bold" fill="#00f0ff" filter="url(#kpiGlow)">3+</text>
  <!-- Label -->
  <text x="108" y="110" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="9" fill="#475569" letter-spacing="2">YEARS EXPERIENCE</text>
  <!-- Sub-label -->
  <text x="108" y="127" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="8" fill="#00f0ff" opacity="0.55">Active Developer</text>

  <!-- ===== TILE 2: PROJECTS (MAGENTA) ===== -->
  <rect x="221" y="11" width="194" height="128" rx="10" fill="url(#t2bg)" stroke="#ff007f" stroke-width="1.2"/>
  <rect x="221" y="11" width="194" height="4" rx="3" fill="#ff007f" opacity="0.7"/>
  <rect x="221" y="11" width="194" height="128" rx="10" fill="none" stroke="#ff007f" stroke-width="1">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.7s" repeatCount="indefinite"/>
  </rect>
  <text x="318" y="53" text-anchor="middle" font-family="Arial" font-size="22">🚀</text>
  <text x="318" y="90" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="32" font-weight="bold" fill="#ff007f" filter="url(#kpiGlow)">15+</text>
  <text x="318" y="110" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="9" fill="#475569" letter-spacing="2">PROJECTS SHIPPED</text>
  <text x="318" y="127" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="8" fill="#ff007f" opacity="0.55">Bots · Gamemodes · APIs</text>

  <!-- ===== TILE 3: UPTIME (PURPLE) ===== -->
  <rect x="431" y="11" width="194" height="128" rx="10" fill="url(#t3bg)" stroke="#a855f7" stroke-width="1.2"/>
  <rect x="431" y="11" width="194" height="4" rx="3" fill="#a855f7" opacity="0.7"/>
  <rect x="431" y="11" width="194" height="128" rx="10" fill="none" stroke="#a855f7" stroke-width="1">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4.2s" repeatCount="indefinite"/>
  </rect>
  <text x="528" y="53" text-anchor="middle" font-family="Arial" font-size="22">🛡️</text>
  <text x="528" y="88" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="26" font-weight="bold" fill="#a855f7" filter="url(#kpiGlow)">99.9%</text>
  <text x="528" y="110" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="9" fill="#475569" letter-spacing="2">UPTIME SECURED</text>
  <text x="528" y="127" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="8" fill="#a855f7" opacity="0.55">DDoS Protected Systems</text>

  <!-- ===== TILE 4: LINES OF CODE (GOLD) ===== -->
  <rect x="641" y="11" width="208" height="128" rx="10" fill="url(#t4bg)" stroke="#fbbf24" stroke-width="1.2"/>
  <rect x="641" y="11" width="208" height="4" rx="3" fill="#fbbf24" opacity="0.7"/>
  <rect x="641" y="11" width="208" height="128" rx="10" fill="none" stroke="#fbbf24" stroke-width="1">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <text x="745" y="53" text-anchor="middle" font-family="Arial" font-size="22">📟</text>
  <text x="745" y="90" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="30" font-weight="bold" fill="#fbbf24" filter="url(#kpiGlow)">50K+</text>
  <text x="745" y="110" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="9" fill="#475569" letter-spacing="2">LINES OF CODE</text>
  <text x="745" y="127" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="8" fill="#fbbf24" opacity="0.55">Pawn · JS · TypeScript · Py</text>

</svg>
