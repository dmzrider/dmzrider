<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 50" width="860">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#03050d"/>
      <stop offset="50%" stop-color="#06091a"/>
      <stop offset="100%" stop-color="#03050d"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="50%"  stop-color="#a855f7" stop-opacity="1"/>
      <stop offset="80%"  stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="860" height="50" rx="9" fill="url(#bg)" stroke="#0d1e3a" stroke-width="1.2"/>
  <!-- Animated border glow -->
  <rect width="860" height="50" rx="9" fill="none" stroke="#a855f7" stroke-width="0.8">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="4s" repeatCount="indefinite"/>
  </rect>
  <!-- Left accent bar -->
  <rect x="0" y="0" width="5" height="50" rx="3" fill="#a855f7" opacity="0.9"/>
  <!-- Corner decoration top-left -->
  <text x="15" y="15" font-family="'Courier New',Courier,monospace" font-size="7" fill="#a855f7" opacity="0.4" letter-spacing="2">// SECTION</text>
  <!-- Main label -->
  <text x="15" y="36" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="bold" fill="#a855f7" letter-spacing="1" filter="url(#glow)">💻  SKILL MATRIX & TECH STACK</text>
  <!-- Right tag decoration -->
  <text x="848" y="34" font-family="'Courier New',Courier,monospace" font-size="13" fill="#152040" text-anchor="end">{ stack }</text>
  <!-- Bottom gradient underline -->
  <rect x="0" y="48" width="860" height="2" rx="1" fill="url(#line)"/>
</svg>