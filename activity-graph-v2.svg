<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="agbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a18"/>
      <stop offset="100%" stop-color="#090e1c"/>
    </linearGradient>

    <!-- Path Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>

    <!-- Area Gradient (glowing fill below line) -->
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Dots Pattern -->
    <pattern id="dotPattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#1e3a6f" opacity="0.3"/>
    </pattern>

    <!-- Filters for glows -->
    <filter id="agGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="pointGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer Card Container -->
  <rect width="860" height="200" rx="14" fill="url(#agbg)" stroke="#1a2b54" stroke-width="1.2"/>
  <rect width="860" height="200" rx="14" fill="none" stroke="#4f46e5" stroke-width="1.5" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#4f46e5;#00f0ff;#a855f7;#ff007f;#4f46e5" dur="10s" repeatCount="indefinite"/>
  </rect>

  <!-- Header Section -->
  <text x="30" y="32" font-family="'Courier New',Courier,monospace" font-size="11" font-weight="bold" fill="#00f0ff" letter-spacing="2">// DAILY_ACTIVITY_MONITOR (30D)</text>
  <text x="830" y="31" font-family="'Courier New',Courier,monospace" font-size="9" fill="#64748b" text-anchor="end">STATUS: ACTIVE</text>
  <line x1="30" y1="38" x2="830" y2="38" stroke="#1e3a5f" stroke-width="0.8" opacity="0.4"/>

  <!-- Chart Grid Lines -->
  <rect x="50" y="55" width="760" height="100" fill="url(#dotPattern)"/>

  <!-- Fine Telemetry Y-Axis Gridlines & Ticks -->
  <g stroke="#1e3a6f" stroke-width="0.5" opacity="0.35">
    <!-- Horizontal Grid Levels -->
    <line x1="50" y1="55"  x2="810" y2="55"/>
    <text x="42" y="58" font-family="'Courier New',Courier,monospace" font-size="8" fill="#64748b" stroke="none" text-anchor="end">12 ACT</text>

    <line x1="50" y1="80"  x2="810" y2="80"/>
    <text x="42" y="83" font-family="'Courier New',Courier,monospace" font-size="8" fill="#64748b" stroke="none" text-anchor="end">9 ACT</text>

    <line x1="50" y1="105" x2="810" y2="105"/>
    <text x="42" y="108" font-family="'Courier New',Courier,monospace" font-size="8" fill="#64748b" stroke="none" text-anchor="end">6 ACT</text>

    <line x1="50" y1="130" x2="810" y2="130"/>
    <text x="42" y="133" font-family="'Courier New',Courier,monospace" font-size="8" fill="#64748b" stroke="none" text-anchor="end">3 ACT</text>

    <line x1="50" y1="155" x2="810" y2="155"/>
    <text x="42" y="158" font-family="'Courier New',Courier,monospace" font-size="8" fill="#64748b" stroke="none" text-anchor="end">0 ACT</text>

    <!-- Vertical Time Slots (6 weeks slots) -->
    <line x1="176.6" y1="55" x2="176.6" y2="155"/>
    <line x1="303.2" y1="55" x2="303.2" y2="155"/>
    <line x1="430.0" y1="55" x2="430.0" y2="155"/>
    <line x1="556.6" y1="55" x2="556.6" y2="155"/>
    <line x1="683.2" y1="55" x2="683.2" y2="155"/>
  </g>

  <!-- Baseline -->
  <line x1="50" y1="155" x2="810" y2="155" stroke="#1e3a6f" stroke-width="1.2"/>

  <!-- Chart Area Clipping Path -->
  <clipPath id="chartClip">
    <rect x="50" y="50" width="760" height="110"/>
  </clipPath>

  <!-- Dynamic Area Fill -->
  <path d="M 50.0 155.0 C 58.7 147.9, 67.5 120.8, 76.2 112.5 C 84.9 104.2, 93.7 103.1, 102.4 105.4 C 111.1 107.8, 119.9 118.4, 128.6 126.7 C 137.4 134.9, 146.1 150.3, 154.8 155.0 C 163.6 159.7, 172.3 155.0, 181.0 155.0 C 189.8 155.0, 198.5 160.0, 207.2 155.0 C 216.0 140.8, 224.7 77.1, 233.4 70.0 C 242.2 62.9, 250.9 104.2, 259.7 112.5 C 268.4 120.8, 277.1 112.5, 285.9 119.6 C 294.6 126.7, 303.3 149.1, 312.1 155.0 C 320.8 160.0, 329.5 155.0, 338.3 155.0 C 347.0 155.0, 355.7 155.0, 364.5 155.0 C 373.2 155.0, 382.0 155.0, 390.7 155.0 C 399.4 155.0, 408.2 155.0, 416.9 155.0 C 425.6 155.0, 434.4 155.0, 443.1 155.0 C 451.8 155.0, 460.6 155.0, 469.3 155.0 C 478.0 155.0, 486.8 155.0, 495.5 155.0 C 504.3 155.0, 513.0 155.0, 521.7 155.0 C 530.5 155.0, 539.2 155.0, 547.9 155.0 C 556.7 155.0, 565.4 155.0, 574.1 155.0 C 582.9 155.0, 591.6 157.4, 600.3 155.0 C 609.1 152.6, 617.8 140.8, 626.6 140.8 C 635.3 140.8, 644.0 156.2, 652.8 155.0 C 661.5 153.8, 670.2 147.9, 679.0 133.8 C 687.7 119.6, 696.4 66.5, 705.2 70.0 C 713.9 73.5, 722.6 140.8, 731.4 155.0 C 740.1 160.0, 748.9 155.0, 757.6 155.0 C 766.3 155.0, 775.1 155.0, 783.8 155.0 C 792.5 155.0, 801.3 155.0, 810.0 155.0 L 810,155 L 50,155 Z" fill="url(#areaGrad)" clip-path="url(#chartClip)"/>

  <!-- Dynamic Activity Wave (Cubic Spline Path) -->
  <path d="M 50.0 155.0 C 58.7 147.9, 67.5 120.8, 76.2 112.5 C 84.9 104.2, 93.7 103.1, 102.4 105.4 C 111.1 107.8, 119.9 118.4, 128.6 126.7 C 137.4 134.9, 146.1 150.3, 154.8 155.0 C 163.6 159.7, 172.3 155.0, 181.0 155.0 C 189.8 155.0, 198.5 160.0, 207.2 155.0 C 216.0 140.8, 224.7 77.1, 233.4 70.0 C 242.2 62.9, 250.9 104.2, 259.7 112.5 C 268.4 120.8, 277.1 112.5, 285.9 119.6 C 294.6 126.7, 303.3 149.1, 312.1 155.0 C 320.8 160.0, 329.5 155.0, 338.3 155.0 C 347.0 155.0, 355.7 155.0, 364.5 155.0 C 373.2 155.0, 382.0 155.0, 390.7 155.0 C 399.4 155.0, 408.2 155.0, 416.9 155.0 C 425.6 155.0, 434.4 155.0, 443.1 155.0 C 451.8 155.0, 460.6 155.0, 469.3 155.0 C 478.0 155.0, 486.8 155.0, 495.5 155.0 C 504.3 155.0, 513.0 155.0, 521.7 155.0 C 530.5 155.0, 539.2 155.0, 547.9 155.0 C 556.7 155.0, 565.4 155.0, 574.1 155.0 C 582.9 155.0, 591.6 157.4, 600.3 155.0 C 609.1 152.6, 617.8 140.8, 626.6 140.8 C 635.3 140.8, 644.0 156.2, 652.8 155.0 C 661.5 153.8, 670.2 147.9, 679.0 133.8 C 687.7 119.6, 696.4 66.5, 705.2 70.0 C 713.9 73.5, 722.6 140.8, 731.4 155.0 C 740.1 160.0, 748.9 155.0, 757.6 155.0 C 766.3 155.0, 775.1 155.0, 783.8 155.0 C 792.5 155.0, 801.3 155.0, 810.0 155.0" fill="none" stroke="url(#lineGrad)" stroke-width="3" filter="url(#agGlow)" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#chartClip)">
    <animate attributeName="stroke-dasharray" values="0,2000;2000,0" dur="2s" fill="freeze"/>
  </path>

  <!-- Dynamic Trendline (Moving Average / Dotted) -->
  <path d="M 50.0 155.0 C 58.7 146.8, 67.5 117.9, 76.2 106.1 C 84.9 94.3, 93.7 87.7, 102.4 84.3 C 111.1 81.0, 119.9 83.2, 128.6 85.7 C 137.4 88.2, 146.1 97.3, 154.8 99.6 C 163.6 101.9, 172.3 96.3, 181.0 99.6 C 189.8 102.8, 198.5 118.6, 207.2 119.1 C 216.0 119.7, 224.7 106.6, 233.4 102.8 C 242.2 99.0, 250.9 100.1, 259.7 96.3 C 268.4 92.5, 277.1 82.7, 285.9 80.0 C 294.6 77.3, 303.3 80.0, 312.1 80.0 C 320.8 80.0, 329.5 73.5, 338.3 80.0 C 347.0 86.5, 355.7 109.3, 364.5 119.1 C 373.2 128.9, 382.0 132.7, 390.7 138.7 C 399.4 144.7, 408.2 152.3, 416.9 155.0 C 425.6 157.7, 434.4 155.0, 443.1 155.0 C 451.8 155.0, 460.6 155.0, 469.3 155.0 C 478.0 155.0, 486.8 155.0, 495.5 155.0 C 504.3 155.0, 513.0 155.0, 521.7 155.0 C 530.5 155.0, 539.2 155.0, 547.9 155.0 C 556.7 155.0, 565.4 155.0, 574.1 155.0 C 582.9 155.0, 591.6 156.1, 600.3 155.0 C 609.1 153.9, 617.8 149.6, 626.6 148.5 C 635.3 147.4, 644.0 150.1, 652.8 148.5 C 661.5 146.8, 670.2 146.8, 679.0 138.7 C 687.7 130.5, 696.4 106.1, 705.2 99.6 C 713.9 93.0, 722.6 98.5, 731.4 99.6 C 740.1 100.7, 748.9 105.0, 757.6 106.1 C 766.3 107.2, 775.1 104.5, 783.8 106.1 C 792.5 107.7, 801.3 114.2, 810.0 115.9" fill="none" stroke="#ff007f" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6" clip-path="url(#chartClip)"/>

  <!-- ================= PROFESSIONAL HUD CROSSHAIRS ================= -->
  <line id="peakVLine" x1="233.4" y1="70.0" x2="233.4" y2="155.0" stroke="#ff007f" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6" clip-path="url(#chartClip)"/>
  <line id="peakHLine" x1="50.0" y1="70.0" x2="233.4" y2="70.0" stroke="#ff007f" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6" clip-path="url(#chartClip)"/>
  <circle id="peakCircle" cx="233.4" cy="70.0" r="5" fill="none" stroke="#ff007f" stroke-width="1.5" filter="url(#pointGlow)"/>

  <!-- X-Axis Labels (Days timeline) -->
  <g font-family="'Courier New',Courier,monospace" font-size="8" fill="#64748b" text-anchor="middle">
    <text x="50"    y="172">30D AGO</text>
    <text x="176.6" y="172">WEEK 1</text>
    <text x="303.2" y="172">WEEK 2</text>
    <text x="430.0" y="172">WEEK 3</text>
    <text x="556.6" y="172">WEEK 4</text>
    <text x="683.2" y="172">WEEK 5</text>
    <text x="810"    y="172">TODAY</text>
  </g>

  <!-- Telemetry indicators at the bottom -->
  <g transform="translate(50, 190)" font-family="Arial,sans-serif" font-size="9" fill="#64748b">
    <rect x="0" y="-7" width="8" height="8" rx="2" fill="#00f0ff"/>
    <text x="14" y="1">Commits</text>
    
    <rect x="90" y="-7" width="8" height="8" rx="2" fill="#a855f7"/>
    <text x="104" y="1">Pull Requests</text>

    <rect x="195" y="-7" width="8" height="8" rx="2" fill="#ff007f"/>
    <text x="209" y="1">Reviews</text>

    <line x1="290" y1="-3" x2="305" y2="-3" stroke="#ff007f" stroke-width="1.5" stroke-dasharray="2 2"/>
    <text x="312" y="1">Trend Velocity</text>
    
    <!-- Real-time Run-Rate Indicator on the far right -->
    <text x="760" y="1" font-family="'Courier New',Courier,monospace" fill="#00f0ff" text-anchor="end" font-weight="bold">GOAL RATE: <tspan fill="#a855f7">100%</tspan></text>
  </g>

  <!-- Dynamic Data Point Markers (Generated by Script) -->
  <g id="dynamicPoints">
  </g>

  <!-- Floating HUD Peak marker -->
  <g id="peakHUD" transform="translate(192, 45)" opacity="0.95">
    <rect x="0" y="0" width="82" height="15" rx="3" fill="#1e1b4b" stroke="#ff007f" stroke-width="0.8"/>
    <text id="peakHUDText" x="41" y="10" font-family="'Courier New',Courier,monospace" font-size="7" font-weight="bold" fill="#ff007f" text-anchor="middle">PEAK: 12 ACT</text>
  </g>

</svg>
