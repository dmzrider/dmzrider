<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="agbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a18"/>
      <stop offset="100%" stop-color="#090e1c"/>
    </linearGradient>

    <!-- Path Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>

    <!-- Area Gradient (glowing fill below line) -->
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Dots Pattern -->
    <pattern id="dotPattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#1e3a6f" opacity="0.3"/>
    </pattern>

    <!-- Filters for glows -->
    <filter id="agGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="pointGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer Card Container -->
  <rect width="860" height="200" rx="14" fill="url(#agbg)" stroke="#1a2b54" stroke-width="1.2"/>
  <rect width="860" height="200" rx="14" fill="none" stroke="#4f46e5" stroke-width="1.5" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#4f46e5;#00f0ff;#a855f7;#ff007f;#4f46e5" dur="10s" repeatCount="indefinite"/>
  </rect>

  <!-- Header Section -->
  <text x="30" y="32" font-family="'Courier New',Courier,monospace" font-size="11" font-weight="bold" fill="#00f0ff" letter-spacing="2">// DAILY_ACTIVITY_MONITOR (30D)</text>
  <text x="830" y="31" font-family="'Courier New',Courier,monospace" font-size="9" fill="#64748b" text-anchor="end">STATUS: ACTIVE</text>
  <line x1="30" y1="38" x2="830" y2="38" stroke="#1e3a5f" stroke-width="0.8" opacity="0.4"/>

  <!-- Chart Grid Lines -->
  <rect x="50" y="55" width="760" height="100" fill="url(#dotPattern)"/>

  <!-- Fine Telemetry Y-Axis Gridlines & Ticks -->
  <g stroke="#1e3a6f" stroke-width="0.5" opacity="0.35">
    <!-- Horizontal Grid Levels -->
    <line x1="50" y1="55"  x2="810" y2="55"/>
    <text x="42" y="58" font-family="'Courier New',Courier,monospace" font-size="8" fill="#64748b" stroke="none" text-anchor="end">12 ACT</text>

    <line x1="50" y1="80"  x2="810" y2="80"/>
    <text x="42" y="83" font-family="'Courier New',Courier,monospace" font-size="8" fill="#64748b" stroke="none" text-anchor="end">9 ACT</text>

    <line x1="50" y1="105" x2="810" y2="105"/>
    <text x="42" y="108" font-family="'Courier New',Courier,monospace" font-size="8" fill="#64748b" stroke="none" text-anchor="end">6 ACT</text>

    <line x1="50" y1="130" x2="810" y2="130"/>
    <text x="42" y="133" font-family="'Courier New',Courier,monospace" font-size="8" fill="#64748b" stroke="none" text-anchor="end">3 ACT</text>

    <line x1="50" y1="155" x2="810" y2="155"/>
    <text x="42" y="158" font-family="'Courier New',Courier,monospace" font-size="8" fill="#64748b" stroke="none" text-anchor="end">0 ACT</text>

    <!-- Vertical Time Slots (6 weeks slots) -->
    <line x1="176.6" y1="55" x2="176.6" y2="155"/>
    <line x1="303.2" y1="55" x2="303.2" y2="155"/>
    <line x1="430.0" y1="55" x2="430.0" y2="155"/>
    <line x1="556.6" y1="55" x2="556.6" y2="155"/>
    <line x1="683.2" y1="55" x2="683.2" y2="155"/>
  </g>

  <!-- Baseline -->
  <line x1="50" y1="155" x2="810" y2="155" stroke="#1e3a6f" stroke-width="1.2"/>

  <!-- Chart Area Clipping Path -->
  <clipPath id="chartClip">
    <rect x="50" y="50" width="760" height="110"/>
  </clipPath>

  <!-- Dynamic Area Fill -->
  <path d="M 50.0 155.0 C 58.7 155.0, 67.5 155.0, 76.2 155.0 C 84.9 155.0, 93.7 155.0, 102.4 155.0 C 111.1 155.0, 119.9 155.0, 128.6 155.0 C 137.4 155.0, 146.1 155.0, 154.8 155.0 C 163.6 155.0, 172.3 155.0, 181.0 155.0 C 189.8 155.0, 198.5 155.0, 207.2 155.0 C 216.0 155.0, 224.7 155.0, 233.4 155.0 C 242.2 155.0, 250.9 155.0, 259.7 155.0 C 268.4 155.0, 277.1 155.0, 285.9 155.0 C 294.6 155.0, 303.3 155.0, 312.1 155.0 C 320.8 155.0, 329.5 157.4, 338.3 155.0 C 347.0 152.6, 355.7 140.8, 364.5 140.8 C 373.2 140.8, 382.0 156.2, 390.7 155.0 C 399.4 153.8, 408.2 147.9, 416.9 133.8 C 425.6 119.6, 434.4 66.5, 443.1 70.0 C 451.8 73.5, 460.6 140.8, 469.3 155.0 C 478.0 160.0, 486.8 155.0, 495.5 155.0 C 504.3 155.0, 513.0 155.0, 521.7 155.0 C 530.5 155.0, 539.2 155.0, 547.9 155.0 C 556.7 155.0, 565.4 155.0, 574.1 155.0 C 582.9 155.0, 591.6 155.0, 600.3 155.0 C 609.1 155.0, 617.8 155.0, 626.6 155.0 C 635.3 155.0, 644.0 155.0, 652.8 155.0 C 661.5 155.0, 670.2 155.0, 679.0 155.0 C 687.7 155.0, 696.4 155.0, 705.2 155.0 C 713.9 155.0, 722.6 155.0, 731.4 155.0 C 740.1 155.0, 748.9 155.0, 757.6 155.0 C 766.3 155.0, 775.1 155.0, 783.8 155.0 C 792.5 155.0, 801.3 155.0, 810.0 155.0 L 810,155 L 50,155 Z" fill="url(#areaGrad)" clip-path="url(#chartClip)"/>

  <!-- Dynamic Activity Wave (Cubic Spline Path) -->
  <path d="M 50.0 155.0 C 58.7 155.0, 67.5 155.0, 76.2 155.0 C 84.9 155.0, 93.7 155.0, 102.4 155.0 C 111.1 155.0, 119.9 155.0, 128.6 155.0 C 137.4 155.0, 146.1 155.0, 154.8 155.0 C 163.6 155.0, 172.3 155.0, 181.0 155.0 C 189.8 155.0, 198.5 155.0, 207.2 155.0 C 216.0 155.0, 224.7 155.0, 233.4 155.0 C 242.2 155.0, 250.9 155.0, 259.7 155.0 C 268.4 155.0, 277.1 155.0, 285.9 155.0 C 294.6 155.0, 303.3 155.0, 312.1 155.0 C 320.8 155.0, 329.5 157.4, 338.3 155.0 C 347.0 152.6, 355.7 140.8, 364.5 140.8 C 373.2 140.8, 382.0 156.2, 390.7 155.0 C 399.4 153.8, 408.2 147.9, 416.9 133.8 C 425.6 119.6, 434.4 66.5, 443.1 70.0 C 451.8 73.5, 460.6 140.8, 469.3 155.0 C 478.0 160.0, 486.8 155.0, 495.5 155.0 C 504.3 155.0, 513.0 155.0, 521.7 155.0 C 530.5 155.0, 539.2 155.0, 547.9 155.0 C 556.7 155.0, 565.4 155.0, 574.1 155.0 C 582.9 155.0, 591.6 155.0, 600.3 155.0 C 609.1 155.0, 617.8 155.0, 626.6 155.0 C 635.3 155.0, 644.0 155.0, 652.8 155.0 C 661.5 155.0, 670.2 155.0, 679.0 155.0 C 687.7 155.0, 696.4 155.0, 705.2 155.0 C 713.9 155.0, 722.6 155.0, 731.4 155.0 C 740.1 155.0, 748.9 155.0, 757.6 155.0 C 766.3 155.0, 775.1 155.0, 783.8 155.0 C 792.5 155.0, 801.3 155.0, 810.0 155.0" fill="none" stroke="url(#lineGrad)" stroke-width="3" filter="url(#agGlow)" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#chartClip)">
    <animate attributeName="stroke-dasharray" values="0,2000;2000,0" dur="2s" fill="freeze"/>
  </path>

  <!-- Dynamic Trendline (Moving Average / Dotted) -->
  <path d="M 50.0 155.0 C 58.7 155.0, 67.5 155.0, 76.2 155.0 C 84.9 155.0, 93.7 155.0, 102.4 155.0 C 111.1 155.0, 119.9 155.0, 128.6 155.0 C 137.4 155.0, 146.1 155.0, 154.8 155.0 C 163.6 155.0, 172.3 155.0, 181.0 155.0 C 189.8 155.0, 198.5 155.0, 207.2 155.0 C 216.0 155.0, 224.7 155.0, 233.4 155.0 C 242.2 155.0, 250.9 155.0, 259.7 155.0 C 268.4 155.0, 277.1 155.0, 285.9 155.0 C 294.6 155.0, 303.3 155.0, 312.1 155.0 C 320.8 155.0, 329.5 156.5, 338.3 155.0 C 347.0 153.5, 355.7 147.6, 364.5 146.2 C 373.2 144.7, 382.0 148.4, 390.7 146.2 C 399.4 144.0, 408.2 144.0, 416.9 132.9 C 425.6 121.9, 434.4 88.8, 443.1 80.0 C 451.8 71.2, 460.6 78.5, 469.3 80.0 C 478.0 81.5, 486.8 87.4, 495.5 88.8 C 504.3 90.3, 513.0 86.6, 521.7 88.8 C 530.5 91.0, 539.2 91.0, 547.9 102.1 C 556.7 113.1, 565.4 146.2, 574.1 155.0 C 582.9 160.0, 591.6 155.0, 600.3 155.0 C 609.1 155.0, 617.8 155.0, 626.6 155.0 C 635.3 155.0, 644.0 155.0, 652.8 155.0 C 661.5 155.0, 670.2 155.0, 679.0 155.0 C 687.7 155.0, 696.4 155.0, 705.2 155.0 C 713.9 155.0, 722.6 155.0, 731.4 155.0 C 740.1 155.0, 748.9 155.0, 757.6 155.0 C 766.3 155.0, 775.1 155.0, 783.8 155.0 C 792.5 155.0, 801.3 155.0, 810.0 155.0" fill="none" stroke="#ff007f" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6" clip-path="url(#chartClip)"/>

  <!-- ================= PROFESSIONAL HUD CROSSHAIRS ================= -->
  <line id="peakVLine" x1="443.1" y1="70.0" x2="443.1" y2="155.0" stroke="#ff007f" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6" clip-path="url(#chartClip)"/>
  <line id="peakHLine" x1="50.0" y1="70.0" x2="443.1" y2="70.0" stroke="#ff007f" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6" clip-path="url(#chartClip)"/>
  <circle id="peakCircle" cx="443.1" cy="70.0" r="5" fill="none" stroke="#ff007f" stroke-width="1.5" filter="url(#pointGlow)"/>

  <!-- X-Axis Labels (Days timeline) -->
  <g font-family="'Courier New',Courier,monospace" font-size="8" fill="#64748b" text-anchor="middle">
    <text x="50"    y="172">30D AGO</text>
    <text x="176.6" y="172">WEEK 1</text>
    <text x="303.2" y="172">WEEK 2</text>
    <text x="430.0" y="172">WEEK 3</text>
    <text x="556.6" y="172">WEEK 4</text>
    <text x="683.2" y="172">WEEK 5</text>
    <text x="810"    y="172">TODAY</text>
  </g>

  <!-- Telemetry indicators at the bottom -->
  <g transform="translate(50, 190)" font-family="Arial,sans-serif" font-size="9" fill="#64748b">
    <rect x="0" y="-7" width="8" height="8" rx="2" fill="#00f0ff"/>
    <text x="14" y="1">Commits</text>
    
    <rect x="90" y="-7" width="8" height="8" rx="2" fill="#a855f7"/>
    <text x="104" y="1">Pull Requests</text>

    <rect x="195" y="-7" width="8" height="8" rx="2" fill="#ff007f"/>
    <text x="209" y="1">Reviews</text>

    <line x1="290" y1="-3" x2="305" y2="-3" stroke="#ff007f" stroke-width="1.5" stroke-dasharray="2 2"/>
    <text x="312" y="1">Trend Velocity</text>
    
    <!-- Real-time Run-Rate Indicator on the far right -->
    <text x="760" y="1" font-family="'Courier New',Courier,monospace" fill="#00f0ff" text-anchor="end" font-weight="bold">GOAL RATE: <tspan fill="#a855f7">42%</tspan></text>
  </g>

  <!-- Dynamic Data Point Markers (Generated by Script) -->
  <g id="dynamicPoints">
  </g>

  <!-- Floating HUD Peak marker -->
  <g id="peakHUD" transform="translate(402, 45)" opacity="0.95">
    <rect x="0" y="0" width="82" height="15" rx="3" fill="#1e1b4b" stroke="#ff007f" stroke-width="0.8"/>
    <text id="peakHUDText" x="41" y="10" font-family="'Courier New',Courier,monospace" font-size="7" font-weight="bold" fill="#ff007f" text-anchor="middle">PEAK: 12 ACT</text>
  </g>

</svg>
