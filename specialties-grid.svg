<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240" width="860">
  <defs>
    <linearGradient id="spbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060e"/>
      <stop offset="100%" stop-color="#080d1c"/>
    </linearGradient>
    <!-- Card tint gradients -->
    <linearGradient id="sp1bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001d29"/>
      <stop offset="100%" stop-color="#00060c"/>
    </linearGradient>
    <linearGradient id="sp2bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0830"/>
      <stop offset="100%" stop-color="#080014"/>
    </linearGradient>
    <linearGradient id="sp3bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#280016"/>
      <stop offset="100%" stop-color="#10000a"/>
    </linearGradient>
    <linearGradient id="sp4bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#251800"/>
      <stop offset="100%" stop-color="#0f0900"/>
    </linearGradient>
    <filter id="spGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="spGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0a1830" stroke-width="0.4"/>
    </pattern>
    <pattern id="spScanlines" x="0" y="0" width="860" height="4" patternUnits="userSpaceOnUse">
      <rect width="860" height="1.5" y="0" fill="#a855f7" opacity="0.01"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="240" rx="13" fill="url(#spbg)"/>
  <rect width="860" height="240" rx="13" fill="url(#spGrid)" opacity="0.5"/>
  <rect width="860" height="240" rx="13" fill="url(#spScanlines)"/>
  <rect width="860" height="240" rx="13" fill="none" stroke="#1a2a4a" stroke-width="1.5"/>
  <rect width="860" height="240" rx="13" fill="none" stroke="#00f0ff" stroke-width="1">
    <animate attributeName="opacity" values="0.1;0.35;0.1" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- ===== TOP-LEFT: Discord Bot Dev (CYAN) ===== -->
  <rect x="11" y="11" width="414" height="108" rx="10" fill="url(#sp1bg)" stroke="#00f0ff" stroke-width="1.2"/>
  <!-- Left border accent -->
  <rect x="11" y="11" width="4" height="108" rx="3" fill="#00f0ff" opacity="0.7"/>
  <!-- Animated border -->
  <rect x="11" y="11" width="414" height="108" rx="10" fill="none" stroke="#00f0ff" stroke-width="1">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <!-- Header row -->
  <text x="30" y="40" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="bold" fill="#00f0ff" filter="url(#spGlow)">🤖  Discord Bot Development</text>
  <line x1="26" y1="48" x2="418" y2="48" stroke="#00f0ff" stroke-width="0.5" opacity="0.3"/>
  <!-- Bullet points -->
  <text x="30" y="67" font-family="'Courier New',Courier,monospace" font-size="10">
    <tspan fill="#00f0ff">›</tspan>
    <tspan fill="#94a3b8" dx="6">Slash commands, modals, buttons, select menus</tspan>
  </text>
  <text x="30" y="84" font-family="'Courier New',Courier,monospace" font-size="10">
    <tspan fill="#00f0ff">›</tspan>
    <tspan fill="#94a3b8" dx="6">Multi-guild sync, role mirroring, OAuth2 &amp; webhooks</tspan>
  </text>
  <text x="30" y="101" font-family="'Courier New',Courier,monospace" font-size="10">
    <tspan fill="#00f0ff">›</tspan>
    <tspan fill="#94a3b8" dx="6">Antispam, rate-limit control, automated threat detection</tspan>
  </text>
  <!-- Tag -->
  <rect x="340" y="16" width="78" height="17" rx="5" fill="#001a24" stroke="#00f0ff" stroke-width="0.8"/>
  <text x="379" y="28" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="8" fill="#00f0ff" letter-spacing="1">discord.js</text>

  <!-- ===== TOP-RIGHT: SA-MP Pawn (PURPLE) ===== -->
  <rect x="435" y="11" width="414" height="108" rx="10" fill="url(#sp2bg)" stroke="#a855f7" stroke-width="1.2"/>
  <rect x="435" y="11" width="4" height="108" rx="3" fill="#a855f7" opacity="0.7"/>
  <rect x="435" y="11" width="414" height="108" rx="10" fill="none" stroke="#a855f7" stroke-width="1">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4.2s" repeatCount="indefinite"/>
  </rect>
  <text x="454" y="40" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="bold" fill="#a855f7" filter="url(#spGlow)">🎮  SA-MP / Open.MP Pawn</text>
  <line x1="450" y1="48" x2="842" y2="48" stroke="#a855f7" stroke-width="0.5" opacity="0.3"/>
  <text x="454" y="67" font-family="'Courier New',Courier,monospace" font-size="10">
    <tspan fill="#a855f7">›</tspan>
    <tspan fill="#94a3b8" dx="6">Modular gamemodes with y_less libs (y_commands, y_inline)</tspan>
  </text>
  <text x="454" y="84" font-family="'Courier New',Courier,monospace" font-size="10">
    <tspan fill="#a855f7">›</tspan>
    <tspan fill="#94a3b8" dx="6">MySQL threaded queries, inventory &amp; economy systems</tspan>
  </text>
  <text x="454" y="101" font-family="'Courier New',Courier,monospace" font-size="10">
    <tspan fill="#a855f7">›</tspan>
    <tspan fill="#94a3b8" dx="6">Tick-rate optimization, low-latency scripting, 3.6 MB codebase</tspan>
  </text>
  <rect x="763" y="16" width="78" height="17" rx="5" fill="#16002e" stroke="#a855f7" stroke-width="0.8"/>
  <text x="802" y="28" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="8" fill="#a855f7" letter-spacing="1">AKRP-V5</text>

  <!-- ===== BOTTOM-LEFT: Security (MAGENTA) ===== -->
  <rect x="11" y="129" width="414" height="100" rx="10" fill="url(#sp3bg)" stroke="#ff007f" stroke-width="1.2"/>
  <rect x="11" y="129" width="4" height="100" rx="3" fill="#ff007f" opacity="0.7"/>
  <rect x="11" y="129" width="414" height="100" rx="10" fill="none" stroke="#ff007f" stroke-width="1">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="30" y="158" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="bold" fill="#ff007f" filter="url(#spGlow)">🛡️  Security &amp; DDoS Shields</text>
  <line x1="26" y1="166" x2="418" y2="166" stroke="#ff007f" stroke-width="0.5" opacity="0.3"/>
  <text x="30" y="184" font-family="'Courier New',Courier,monospace" font-size="10">
    <tspan fill="#ff007f">›</tspan>
    <tspan fill="#94a3b8" dx="6">Shell hooks monitoring ingress spikes &amp; traffic anomalies</tspan>
  </text>
  <text x="30" y="201" font-family="'Courier New',Courier,monospace" font-size="10">
    <tspan fill="#ff007f">›</tspan>
    <tspan fill="#94a3b8" dx="6">Real-time Discord webhook DDoS alarms (NovaShield)</tspan>
  </text>
  <text x="30" y="218" font-family="'Courier New',Courier,monospace" font-size="10">
    <tspan fill="#ff007f">›</tspan>
    <tspan fill="#94a3b8" dx="6">Cloudflare proxying, local packet filters, port shielding</tspan>
  </text>
  <rect x="340" y="134" width="78" height="17" rx="5" fill="#240010" stroke="#ff007f" stroke-width="0.8"/>
  <text x="379" y="146" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="8" fill="#ff007f" letter-spacing="1">NovaShield</text>

  <!-- ===== BOTTOM-RIGHT: Freelancing (GOLD) ===== -->
  <rect x="435" y="129" width="414" height="100" rx="10" fill="url(#sp4bg)" stroke="#fbbf24" stroke-width="1.2"/>
  <rect x="435" y="129" width="4" height="100" rx="3" fill="#fbbf24" opacity="0.7"/>
  <rect x="435" y="129" width="414" height="100" rx="10" fill="none" stroke="#fbbf24" stroke-width="1">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4.8s" repeatCount="indefinite"/>
  </rect>
  <text x="454" y="158" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="bold" fill="#fbbf24" filter="url(#spGlow)">💼  Startup Freelancing</text>
  <line x1="450" y1="166" x2="842" y2="166" stroke="#fbbf24" stroke-width="0.5" opacity="0.3"/>
  <text x="454" y="184" font-family="'Courier New',Courier,monospace" font-size="10">
    <tspan fill="#fbbf24">›</tspan>
    <tspan fill="#94a3b8" dx="6">Lightweight microservices with Express / Fastify</tspan>
  </text>
  <text x="454" y="201" font-family="'Courier New',Courier,monospace" font-size="10">
    <tspan fill="#fbbf24">›</tspan>
    <tspan fill="#94a3b8" dx="6">Custom operations dashboards for server metrics</tspan>
  </text>
  <text x="454" y="218" font-family="'Courier New',Courier,monospace" font-size="10">
    <tspan fill="#fbbf24">›</tspan>
    <tspan fill="#94a3b8" dx="6">Startup MVPs, bot integrations &amp; API pipelines</tspan>
  </text>
  <rect x="763" y="134" width="78" height="17" rx="5" fill="#1a1000" stroke="#fbbf24" stroke-width="0.8"/>
  <text x="802" y="146" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="8" fill="#fbbf24" letter-spacing="1">FREELANCE</text>

</svg>
